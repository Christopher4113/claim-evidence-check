[project]
name = "claim-evidence-check"
version = "0.1.0"
description = "Flags Claude Code sessions where the agent claims success but its own test output shows a failure."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2",
  "openai>=1.40",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
